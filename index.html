<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JK Portfolio</title>

    <!-- Set theme before anything paints -->
    <script>
      // Prefer stored theme; otherwise follow system
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const useDark = stored ? stored === 'dark' : prefersDark;

      if (useDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <script type="module" crossorigin src="/Jk-Portfolio/assets/index-kWSmKc2F.js"></script>
    <link rel="stylesheet" crossorigin href="/Jk-Portfolio/assets/index-Bvl92RYX.css">
  </head>

  </body>
</html>
